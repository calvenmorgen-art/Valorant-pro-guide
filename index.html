<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="C1BFkf9VitbqnMZzE__Fp7iO1SxLFD3bad60oUvogmc" />
    <title>Valorant Pro Portal - إلياس</title>
    <style>
        /* خلفية متحركة */
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; color: white;
            background: linear-gradient(45deg, #0f1923, #1f2a36, #ff4655, #0f1923);
            background-size: 400% 400%; animation: gradient 15s ease infinite;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        header { padding: 40px; text-align: center; background: rgba(0,0,0,0.5); border-bottom: 2px solid #ff4655; }
        .youtube-btn { display: inline-block; padding: 10px 25px; background: #ff4655; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
        
        nav { display: flex; justify-content: center; gap: 20px; padding: 20px; background: rgba(0,0,0,0.3); }
        button { background: transparent; border: 1px solid #ff4655; color: white; padding: 10px 20px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff4655; }

        #display-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px; border-radius: 10px; border-left: 4px solid #ff4655; }
        .card img { max-width: 100%; height: 150px; object-fit: contain; }
        
        .tips-page { grid-column: 1/-1; background: rgba(0,0,0,0.7); padding: 30px; border-radius: 15px; line-height: 1.8; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="شعار فالورانت" style="width: 200px; display: block; margin: 0 auto; margin-bottom: 10px;">
    <h1>VALORANT PRO PORTAL</h1>
    <p>بوابتك للاحتراف - تطوير: إلياس</p>
    <a href="http://www.youtube.com/@MorgenCalven" target="_blank" class="youtube-btn">تابعني على يوتيوب 📺</a>
</header>
    

<nav>
    <button onclick="fetchAgents()">العملاء (Agents)</button>
    <button onclick="showTips()">دليل النصائح الشامل</button>
</nav>

<div id="display-area"></div>

<script>
    const area = document.getElementById('display-area');

    // جلب العملاء من API
    async function fetchAgents() {
        area.innerHTML = "<h3>جاري تحميل العملاء...</h3>";
        try {
            const res = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true');
            const data = await res.json();
            area.innerHTML = "";
            data.data.forEach(a => {
                area.innerHTML += `
                    <div class="card">
                        <img src="${a.displayIcon}" alt="${a.displayName}">
                        <h3>${a.displayName}</h3>
                        <p><strong>${a.role.displayName}</strong></p>
                        <p style="font-size:0.9rem">${a.description}</p>
                    </div>
                `;
            });
        } catch(e) { area.innerHTML = "خطأ في الاتصال بالسيرفر"; }
    }

    // صفحة نصائح كاملة
    function showTips() {
        area.innerHTML = `
            <div class="tips-page">
                <h2>📚 الدليل الشامل لاحتراف فالورانت</h2>
                <h3>1. أساسيات القتال (Gunplay)</h3>
                <ul>
                    <li><b>التوقف قبل الإطلاق:</b> لا تطلق النار وأنت تتحرك (Movement Error).</li>
                    <li><b>مستوى الرأس (Head Level):</b> اجعل تصويبك دائماً عند مستوى رأس العدو، لا تنظر للأرض.</li>
                    <li><b>Burst Fire:</b> اطلق رصاصات متقطعة (2-3) بدلاً من الرش الكامل للتحكم في الارتداد.</li>
                </ul>
                <h3>2. الاقتصاد (Economy)</h3>
                <ul>
                    <li><b>Eco Round:</b> إذا كان فريقك لا يملك المال، وفروا جميعاً لتتمكنوا من الشراء في الجولة القادمة.</li>
                    <li><b>نسق الشراء:</b> دائماً اشترِ مع فريقك، لا تضيع أموالك في جولة خاسرة.</li>
                </ul>
                <h3>3. استراتيجيات الخرائط</h3>
                <ul>
                    <li><b>الـ Callouts:</b> تعلم أسماء الأماكن في كل خريطة لتعطي معلومات دقيقة لفريقك.</li>
                    <li><b>السيطرة على المنطقة:</b> لا تندفع لوحدك؛ انتظر استخدام "القدرات" (Abilities) الخاصة بفريقك لتأمين الدخول.</li>
                </ul>
                <h3>4. الجانب الذهني</h3>
                <ul>
                    <li><b>التواصل الإيجابي:</b> لا تكن ساماً (Toxic). الفريق الهادئ يفوز بنسبة أكبر.</li>
                    <li><b>التعلم من الخسارة:</b> راقب لقطات موتك (Death Clips) لتعرف أين أخطأت.</li>
                </ul>
            </div>
        `;
    }
</script>
</body>
</html>
